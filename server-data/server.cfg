# ============================================================================
#  server.cfg - gemeinsame FXServer-Konfiguration (wird in Git eingecheckt)
# ============================================================================
#
#  Aktives Framework: Qbox mit MariaDB (siehe docs/frameworks.md).
#  Diese Datei enthält KEINE Geheimnisse. Lizenzschlüssel, RCON-Passwort,
#  Steam-Key, Datenbank-Zugang und Upload-Tokens stehen in server-data/secrets.cfg
#  (Vorlage: secrets.cfg.example, die echte Datei ist in .gitignore).
#  Weitere committete cfg-Dateien: permissions.cfg, voice.cfg, ox.cfg, misc.cfg.
#
#  Syntax: ein Befehl pro Zeile, Kommentare beginnen mit '#', Werte mit
#  Leerzeichen in Anführungszeichen setzen. Kein Semikolon außerhalb von
#  Anführungszeichen, auch nicht in Kommentaren: FXServer trennt dort Befehle
#  und führt den Rest der Zeile aus ("No such command ...").
#
#  Start:
#    txAdmin-Modus  (Standard): scripts/windows/start.bat, systemd-Unit oder
#                               docker/entrypoint.sh starten FXServer.exe bzw. run.sh
#                               ohne Argumente mit den Umgebungsvariablen
#                               TXHOST_DATA_PATH=<repo>/txData und TXHOST_TXA_PORT=40120,
#                               txAdmin führt danach '+exec server.cfg' aus.
#    Direkt-Modus   (Dev):      scripts/windows/start-direct.bat bzw. von Hand im Repo-Root,
#                               zwei Befehle nacheinander (cmd und PowerShell):
#                                 cd server-data
#                                 ..\artifacts\FXServer.exe +set onesync on +exec server.cfg
#                               (Linux/Docker: cd server-data && bash ../artifacts/run.sh +set onesync on +exec server.cfg)
#                               '+set onesync on' muss VOR '+exec server.cfg' stehen, siehe
#                               Abschnitt "Spieler und Spielversion".
#
#  Stand: September 2026 (Artifact "recommended" 35245, txAdmin 8.1.1,
#  Qbox-Rezept Commit a4be9fc)
# ============================================================================


# ----------------------------------------------------------------------------
#  Netzwerk
# ----------------------------------------------------------------------------
# 0.0.0.0 = auf allen Netzwerkschnittstellen lauschen. Nur den Port ändern,
# wenn 30120 belegt ist. txAdmin reserviert die Ports 40120 bis 40150 für sich.
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"


# ----------------------------------------------------------------------------
#  Server-Identität (wird in der Serverliste angezeigt)
# ----------------------------------------------------------------------------
# sv_hostname: interner Hostname (max. 120 Zeichen), taucht kaum in Listen auf.
sv_hostname "Mein RP-Server (lokal)"

# sv_projectName: Name deines Projekts / deiner Community (max. 40 Zeichen,
# keine Tags oder Aufzählungen, sonst wird der Name in der Liste gekürzt).
# Keine Rockstar- oder FiveM-Namen und keine Lore-Marken im Servernamen, siehe
# docs/inhalte-regeln.md.
sets sv_projectName "Mein RP-Projekt"

# sv_projectDesc: ein ganzer Satz als Beschreibung (max. 250 Zeichen).
# Inhalte-Regeln (PLA §2.3): alle Angaben, die Spieler zum Server sehen (auch der
# Eintrag in der Serverliste), brauchen Betreiber, Kontakt-E-Mail und den Hinweis
# "<NAME> IS NOT APPROVED, SPONSORED, OR ENDORSED BY ROCKSTAR GAMES.", siehe
# docs/inhalte-regeln.md. Der Name im Hinweis muss sv_projectName entsprechen:
# Benennst du das Projekt um, passe den Hinweis hier und in secrets.cfg mit an.
# Betreiber und Kontakt-E-Mail ergänzt du per 'sets sv_projectDesc "..."' in
# secrets.cfg (Vorlage dort), dann stehen sie nicht in Git.
sets sv_projectDesc "Privater deutscher Roleplay-Server auf Basis von Qbox, nur für Freunde. MEIN RP-PROJEKT IS NOT APPROVED, SPONSORED, OR ENDORSED BY ROCKSTAR GAMES."

# Tags, kommagetrennt
sets tags "deutsch, roleplay, qbox"

# Sprache des Servers (BCP-47-Kennung, z. B. "de-DE", "de-AT", "de-CH")
sets locale "de-DE"

# Optionale Bilder für Serverinfo und Verbindungsbildschirm (beliebige Bannergröße).
#sets banner_detail "https://deine-domain.de/banner.png"
#sets banner_connecting "https://deine-domain.de/banner.png"

# Server-Icon: PNG mit genau 96x96 Pixeln, Pfad relativ zu server-data/.
# Das Qbox-Rezept setzt hier sein eigenes Logo, wir nutzen ein eigenes Bild.
#load_server_icon "icon.png"

# Serverliste: Wenn du die folgende Zeile einkommentierst, wird der Server in der
# Serverliste als "privat" angezeigt (Verbinden-Button deaktiviert). Für lokale
# Tests ist das sinnvoll, weil damit auch die Meldung "Could not contact the
# server browser" verschwindet. Direkt verbinden geht trotzdem immer:
# F8-Konsole -> connect localhost:30120 auf dem Server-PC selbst. Freunde verbinden
# sich über die IP-Adresse, siehe docs/windows-lokal.md, Abschnitt "Freunde verbinden".
# Achtung: Ein komplettes Verstecken aus der Liste ist damit NICHT möglich. Wer
# rein darf, regelt die License Allowlist in txAdmin (docs/linux-server.md).
#sv_master1 ""


# ----------------------------------------------------------------------------
#  Spieler und Spielversion
# ----------------------------------------------------------------------------
# Maximale Spielerzahl. Ab 32 Slots ist OneSync Pflicht, bis 48 Slots kostenlos,
# mehr braucht ein Element-Club-Abo (https://fivem.net/server-hosting).
sv_maxclients 32

# OneSync (Server-seitige Entity-Verwaltung, Pflicht ab 32 Slots und für
# Qbox / ox_lib) wird absichtlich in KEINER cfg-Datei gesetzt,
# weder hier noch in secrets.cfg oder den anderen cfg-Dateien:
#   txAdmin-Modus: txAdmin verwaltet OneSync selbst (Settings > FXServer,
#                  Standard "on") und übergibt es beim Start an FXServer.
#   Direkt-Modus:  die Start-Skripte übergeben es als Startargument VOR +exec,
#                  d. h. start-direct.bat startet 'FXServer.exe +set onesync on
#                  +exec server.cfg', unter Linux/Docker entsprechend
#                  'bash ../artifacts/run.sh +set onesync on +exec server.cfg'.
# Niemals 'set onesync on' in eine cfg-Datei schreiben: der txAdmin-CFG-Validator
# kommentiert die Zeile in jeder geladenen cfg-Datei aus (Vermerk
# '## [txAdmin CFG validator]'), OneSync wäre im Direkt-Modus danach still aus
# und die committete Datei in Git dauerhaft geändert (deploy.sh mit
# git pull --ff-only würde beim nächsten Commit an dieser Datei scheitern).

# Spielversion (Game Build), die die Clients laden müssen. Kann nur beim Start
# gesetzt werden. Jeder Build enthält alle Inhalte der vorherigen Builds.
# Aktuelle Tabelle mit allen Builds:
#   https://docs.fivem.net/docs/server-manual/server-commands/#sv_enforcegamebuild-build
# Stand September 2026:
#   3751 = "A Safehouse in the Hills" (mp2025_02), breit verfügbar
#   3889 = "The Kortz Center Heist" (mp2026_01), seit 20.08.2026 zunächst nur
#          im Canary-Kanal des Clients, braucht Artifact >= 35245
# Das Qbox-Rezept setzt 3258. Qbox selbst nennt keinen Pflicht-Build, bob74_ipl
# unterstützt auch neuere Builds. Bei Problemen mit einzelnen Interiors 3258 testen.
sv_enforceGameBuild 3751


# ----------------------------------------------------------------------------
#  Sicherheit
# ----------------------------------------------------------------------------
# Script Hook V für Clients verbieten (0 = verboten, empfohlen).
sv_scriptHookAllowed 0

# sv_endpointPrivacy ist entfernt (Warnung in Artifact 35245): FXServer gibt die
# IP-Adressen der Spieler über keinen HTTP-Endpunkt mehr heraus.

# Manipulierte Client-Dateien blockieren:
# 1 = alles außer Audio und bekannte Grafik-Mods, 2 = alles.
#sv_pureLevel 1


# ----------------------------------------------------------------------------
#  Admin-Rechte (ACE)
# ----------------------------------------------------------------------------
# Gruppen (admin > mod > support) und Rechte für qbx_core und ox_lib.
exec permissions.cfg

# Dich selbst zum Admin machen (z. B. für /admin aus qbx_adminmenu):
#   1. Einmal mit dem Server verbinden.
#   2. In txAdmin unter Players deinen Spieler öffnen, dort stehen die IDs
#      (license:..., fivem:..., discord:...).
#   3. Eine der Zeilen unten einkommentieren, ID eintragen, Server neu starten.
# Das txAdmin-Rezept schreibt diese Zeile automatisch für den txAdmin-Master-Account,
# hier machst du es von Hand. Die txAdmin-Oberfläche selbst braucht das nicht.
#add_principal identifier.license:DEINE_LICENSE_ID group.admin
#add_principal identifier.fivem:DEINE_FIVEM_ID group.admin


# ----------------------------------------------------------------------------
#  Qbox und Ressourcen-Einstellungen (aus dem Qbox-Rezept, eingedeutscht)
# ----------------------------------------------------------------------------
# Chat: der Chat aus dem Artifact, Design von qbx_chat_theme.
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s hat den Server betreten"
set qbx_chat:quitMessage "^1%s hat den Server verlassen (%s)"

# Sprachchat (pma-voice)
exec voice.cfg

# Qbox-Kern (qbx_core), Beschreibung: https://docs.qbox.re/resources/qbx_core/convars
setr qb_locale "de" # für QBCore-Skripte über die Qbox-Brücke, Qbox selbst nutzt ox:locale
setr qbx:enableBridge "true" # Brücke für QBCore-Ressourcen (stellt qb-core bereit)
set qbx:enableQueue "true" # eingebaute Warteschlange beim Verbinden
set qbx:bucketLockdownMode "inactive" # Entity-Sperre pro Routing-Bucket: inactive, relaxed oder strict
set qbx:discordLink "Frag einen Admin" # erscheint in Bann- und Kick-Meldungen, z. B. Einladungslink eurer Community
set qbx:max_jobs_per_player 1 # maximale Anzahl Jobs pro Spieler
set qbx:max_gangs_per_player 1 # maximale Anzahl Gangs pro Spieler
set qbx:setjob_replaces "true" # SetJob ersetzt den bisherigen Hauptjob
set qbx:setgang_replaces "true" # SetGang ersetzt die bisherige Hauptgang
set qbx:cleanPlayerGroups "true" # beim Start Gruppen/Ränge ohne Eintrag in den Configs aus der Datenbank löschen
set qbx:allowMethodOverrides "true" # Ressourcen dürfen Methoden des Spielerobjekts überschreiben
set qbx:disableOverrideWarning "false" # Warnungen beim Überschreiben anzeigen
setr qbx:enableVehiclePersistence "false" # markierte Spielerfahrzeuge nach dem Löschen neu erzeugen
setr qbx:vehiclePersistenceType "semi" # "full" = auch nach Serverneustart, "semi" = nur nach dem Löschen
set qbx:acknowledge "false" # "true" blendet die Standard-Hinweismeldung von Qbox aus
setr qbx:enableGroupManagement "false" # Chefs dürfen Rangnamen von Jobs/Gangs verwalten

# Nachricht im Chat nach dem Einloggen
setr qbx:motd "<p style='padding: 1rem; background-color: #141517; border: 1px solid #373a40; border-radius: 0.5rem; text-align: center;'><span style='color: rgb(200, 200, 40);'>Willkommen auf dem Server!</span><br>Tippe /hallo in den Chat, um die Beispiel-Ressource zu testen.</p>"

# Charakter-Erstellung und Kleidung (illenium-appearance)
setr illenium-appearance:locale "de"

# Wetter und Uhrzeit (Renewed-Weathersync)
setr weather_disablecd true

# ox_lib, ox_target, ox_inventory (inkl. setr ox:locale "de")
exec ox.cfg

# Handy (npwd). Upload-Tokens für Fotos und Sprachnachrichten: secrets.cfg
set npwd:framework "qbx"

# Ladebildschirm (loadscreen)
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#f1e542"
set loadscreen:shadowColor "#1a18077f"

# Weitere Server-Convars (fast alle auskommentiert)
exec misc.cfg


# ----------------------------------------------------------------------------
#  Geheimnisse und lokale Überschreibungen
# ----------------------------------------------------------------------------
# secrets.cfg enthält sv_licenseKey, rcon_password, steam_webApiKey,
# mysql_connection_string (Pflicht für Qbox) und optionale Tokens sowie lokale
# Überschreibungen (z. B. ein anderer sv_hostname auf dem Live-Server).
# Position ist Absicht: NACH den allgemeinen Einstellungen (damit die
# Überschreibungen gewinnen) und VOR dem ensure-Block (damit oxmysql
# den Datenbank-String schon kennt, wenn es startet).
# Ohne secrets.cfg startet der Server nicht sinnvoll ("no license key").
exec secrets.cfg


# ----------------------------------------------------------------------------
#  Ressourcen (Reihenfolge wie im Qbox-Rezept)
# ----------------------------------------------------------------------------
# Basis aus [cfx-default] (install.bat bzw. install.sh) und dem Artifact.
# Stand September 2026 gibt es sessionmanager und hardcap nicht mehr als Ressource
# (das Rezept startet sie noch, das würde nur "Couldn't find resource" melden).
# basic-gamemode wird gestoppt: es schaltet den automatischen Spawn ein und
# kollidiert mit der Charakterauswahl von Qbox.
ensure mapmanager
ensure chat
ensure spawnmanager
stop basic-gamemode
ensure baseevents

# Qbox und Zusatz-Ressourcen aus [vendor] (resources.txt). Die SQL-Dateien aus
# database.txt müssen vorher importiert sein (setup-database, siehe docs/datenbank.md).
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [assets]

# Assets aus dem Cfx Marketplace (nicht in Git, an den Cfx.re-Account gebunden),
# Einrichtung in server-data/resources/[marketplace]/README.md. Ein leerer Ordner startet nichts.
ensure [marketplace]

ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

# Eigene Ressourcen aus server-data/resources/[local]/
ensure hello-world
ensure fahrzeughilfe
ensure probefahrt
ensure spielerinfo
