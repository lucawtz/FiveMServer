# ============================================================================
#  permissions.cfg - ACE-Rechte für Qbox (nach dem Qbox-Rezept, plus quit-Sperre)
# ============================================================================
# Wird von server.cfg per 'exec permissions.cfg' geladen. Admins trägst du in
# server.cfg (Abschnitt "Admin-Rechte") per add_principal ein.

# Admins dürfen alle Befehle, außer den Server per "quit" zu beenden.
# Die quit-Sperre steht nicht im Rezept (wie in der cfx-Standard-server.cfg).
add_ace group.admin command allow
add_ace group.admin command.quit deny

# qbx_core darf Befehle ausführen (z. B. Rechte vergeben)
add_ace resource.qbx_core command allow

# ox_lib darf Rechte und Gruppen zur Laufzeit setzen
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

# Rechte-Gruppen von Qbox
add_ace group.admin admin allow
add_ace group.mod mod allow
add_ace group.support support allow

# Vererbung: admin hat alles von mod, mod alles von support
add_principal group.admin group.mod
add_principal group.mod group.support
