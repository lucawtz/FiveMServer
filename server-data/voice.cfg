# ============================================================================
#  voice.cfg - Einstellungen für den Sprachchat pma-voice (aus dem Qbox-Rezept)
# ============================================================================
# Alle Werte per setr. Gilt nur für pma-voice.
# Hinweis: Funk (voice_defaultRadio) und ox_target nutzen beide standardmäßig
# die linke Alt-Taste (LMENU). Spieler können das in den GTA-Einstellungen unter
# Tastenbelegung > FiveM ändern.

# --- Audio (nur EINE Variante aktivieren) ---
# Spiel-eigenes Audio mit 3D-Klang, Hall usw. Nötig für Funk-/Telefon-Effekte.
setr voice_useNativeAudio true
# 2D-Audio: gleiche Lautstärke im ganzen Hörbereich
# setr voice_use2dAudio false
# 3D-Audio (Standard von pma-voice, nicht zusammen mit Native Audio)
# setr voice_use3dAudio false
# Nur Spieler im eigenen Sende-Bereich hören (meist nicht empfohlen)
# setr voice_useSendingRangeOnly false

# --- Allgemein ---
# Eingebaute Anzeige
setr voice_enableUi 1
# Sprechreichweite per Taste wechseln
setr voice_enableProximityCycle 1
# Taste zum Wechseln der Reichweite (Liste: https://docs.fivem.net/docs/game-references/input-mapper-parameter-ids/keyboard/)
setr voice_defaultCycle "GRAVE"
# Standard-Lautstärke Funk (1 bis 100)
setr voice_defaultRadioVolume 60
# Standard-Lautstärke Telefon (1 bis 100)
setr voice_defaultCallVolume 80
# Reichweite beim Beitreten (1 Flüstern, 2 Normal, 3 Rufen)
setr voice_defaultVoiceMode 2
# Funk aktiv
setr voice_enableRadios 1
# Telefonate aktiv
setr voice_enableCalls 1
# Funk-/Telefon-Klangeffekt (braucht Native Audio)
setr voice_enableSubmix 1
# Schulter-Mikrofon-Animation beim Funken
setr voice_enableRadioAnim 1
# Taste zum Funken
setr voice_defaultRadio "LMENU"
# Aktualisierungsintervall der Anzeige in ms
setr voice_refreshRate 200
# Spieler dürfen Audio-Intents setzen
setr voice_allowSetIntent 1
# Debug-Ausgaben (0 aus, 1 einfach, 4 ausführlich)
setr voice_debugMode 0

# --- Externer Mumble-Server (nur bei Bedarf) ---
# setr voice_externalAddress "127.0.0.1"
# setr voice_externalPort 64738
# Nur auf dem externen Mumble-Server selbst:
# setr voice_externalDisallowJoin 0
# setr voice_hideEndpoints 1
