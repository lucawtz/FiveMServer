# ============================================================================
#  misc.cfg - weitere nützliche Server-Convars (aus dem Qbox-Rezept)
# ============================================================================
# Fast alles ist auskommentiert und zeigt den Standardwert. Beschreibung aller
# Befehle: https://docs.fivem.net/docs/server-manual/server-commands/
# sv_master1 und sv_pureLevel stehen in server.cfg.

# Wie leicht sich eine Spieler-ID je Anbieter ändern darf (1 bis 5, Standard 5)
# set sv_authMaxVariance 5

# Mindest-Vertrauen in die Identität eines Spielers (1 bis 5, Standard 1)
# set sv_authMinTrust 1

# Schutz gegen HTTP-Fluten auf info.json, dynamic.json und players.json (ab 2 "Nope.")
# set sv_requestParanoia 0

# REQUEST_CONTROL_EVENT filtern (Modus 0 bis 3) und Wartezeit in ms für Modus 1 und 3
# set sv_filterRequestControl 0
# set sv_filterRequestControlSettleTimer 30000

# Netzwerk-Sounds über den Server erlauben (Standard true)
# set sv_enableNetworkedSounds true

# Telefon-Explosionen über den Server erlauben (Standard false, besser aus lassen)
# set sv_enablePhoneExplosions false

# SCRIPT_ENTITY_STATE_CHANGE_EVENT über den Server erlauben (Standard true)
# set sv_enableNetworkedScriptEntityStates true

# Client-Einstellungen erzwingen, Beispiele:
# setr profile_fpsCombatroll 0
# setr profile_fpsFieldOfView 30
# setr profile_skfx 1

# HTTP/2 für den Server (experimentell)
# set sv_netHttp2 false

# Zusammensetzen großer Netz-Events (*_LATENT_*)
# setr sv_enableNetEventReassembly true
# setr sv_netEventReassemblyMaxPendingEvents 100
# setr sv_netEventReassemblyUnlimitedPendingEvents false

# Entity-Sperre für den ganzen Server (siehe auch qbx:bucketLockdownMode in server.cfg)
# set sv_entityLockdown "inactive"

# Lade-Kreisel unten rechts im Ladebildschirm ausblenden
setr sv_showBusySpinnerOnLoadingScreen false
