# ============================================================================
#  ox.cfg - Einstellungen für ox_lib, ox_target und ox_inventory (aus dem Qbox-Rezept)
# ============================================================================
# setr = auch für Clients sichtbar, set = nur Server.

# ---------------------------- ox_lib ----------------------------------------
# Farben der Menüs und Hinweise
setr ox:primaryColor blue
setr ox:primaryShade 8

# Spieler dürfen die Sprache per /ox_lib selbst wählen (0 = nein, 1 = ja)
setr ox:userLocales 0

# Sprache für ox_lib und alle Ressourcen mit locales/*.json (Qbox, ox_*)
setr ox:locale "de"

# Logging: Anbieter und Schlüssel in secrets.cfg, siehe
# https://overextended.dev/ox_lib/Modules/Logger/Server

# ---------------------------- ox_target -------------------------------------
# Taste umschalten statt gedrückt halten (0 = halten)
setr ox_target:toggleHotkey 0

# Taste für das Zielsystem (Liste: https://docs.fivem.net/docs/game-references/input-mapper-parameter-ids/keyboard)
setr ox_target:defaultHotkey LMENU

# Höchstzahl der Kreise für Zonen im Umkreis von 7 m beim Zielen (linke Alt-Taste): Wert n zeigt bis zu
# n+1 Kreise, 0 schaltet sie ab. 24 ist der Standard von ox_target. Das Rezept setzt 1 und zeigt damit
# höchstens 2 beliebige Zonen, oft nicht die, auf die man zielt.
setr ox_target:drawSprite 24

# Eingebaute Optionen, z. B. Fahrzeugtüren öffnen
setr ox_target:defaults 1

# Debug-Anzeigen (Umrisse, Strahl)
setr ox_target:debug 0

# Optionen mit Linksklick auswählen
setr ox_target:leftClick 1

# ---------------------------- ox_inventory: gemeinsam ------------------------
# Framework-Anbindung
setr inventory:framework "qbx"

# Anzahl Slots im Spielerinventar
setr inventory:slots 50

# Maximales Tragegewicht in Gramm
setr inventory:weight 85000

# ox_target für Lager, Shops usw. nutzen
setr inventory:target true

# Jobs mit Zugriff auf Waffenkammer und Asservaten
setr inventory:police ["police", "bcso", "sasp"]

# ---------------------------- ox_inventory: Client ---------------------------
# Quelle der Item-Bilder
setr inventory:imagepath "nui://ox_inventory/web/images"

# Waffen bei leerem Magazin automatisch nachladen
setr inventory:autoreload false

# Bildschirm beim Öffnen des Inventars weichzeichnen
setr inventory:screenblur true

# Tasten für Inventar, zweites Inventar und Schnellleiste
setr inventory:keys ["TAB", "K", "F1"]

# Erlaubte Steuerung bei offenem Inventar
setr inventory:enablekeys [249]

# Waffen müssen vor dem Schießen gezielt werden
setr inventory:aimedfiring false

# Beim Geben eine Liste der Spieler in der Nähe zeigen
setr inventory:giveplayerlist true

# Animationen beim Ziehen und Wegstecken von Waffen
setr inventory:weaponanims true

# Hinweise beim Erhalten/Entfernen von Items
setr inventory:itemnotify true

# Hinweise beim Ausrüsten von Waffen
setr inventory:weaponnotify true

# Abgelegte Items als Objekt statt Markierung anzeigen
setr inventory:dropprops true

# Modell für abgelegte Items
setr inventory:dropmodel "prop_med_bag_01b"

# Entwaffnen, wenn eine Waffe ohne passendes Item benutzt wird
setr inventory:weaponmismatch true

# Waffen, die von dieser Prüfung ausgenommen sind
setr inventory:ignoreweapons []

# Waffen- und Munitions-Pickups unterdrücken
setr inventory:suppresspickups 1

# ---------------------------- ox_inventory: Server ---------------------------
# Beim Start auf neue Versionen prüfen
set inventory:versioncheck true

# Unveränderte Lager nach dieser Zeit leeren
set inventory:clearstashes "6 MONTH"

# Webhook für Bild-Metadaten (echte URL nur in secrets.cfg)
set inventory:webhook ""

# Logging über ox_lib (0 aus, 1 normal, 2 inkl. AddItem/RemoveItem und Shopkäufe)
set inventory:loglevel 1

# Preise in Shops schwanken
set inventory:randomprices true

# Zufällige Beute in fremden Fahrzeugen und Müllcontainern
set inventory:randomloot true

# Mindest-Rang, um Items aus der Asservatenkammer zu nehmen
set inventory:evidencegrade 2

# Leerzeichen im Kennzeichen beim Abgleich ignorieren
set inventory:trimplate true

# Beute in Fahrzeugen: [Item, Minimum, Maximum, Chance in Prozent]
# "sprunk" statt "cola" aus dem Rezept: ein Item "cola" ist nirgends definiert (docs/frameworks.md).
set inventory:vehicleloot [
    ["sprunk", 1, 1],
    ["water", 1, 1],
    ["garbage", 1, 2, 50],
    ["panties", 1, 1, 5],
    ["money", 1, 50],
    ["money", 200, 400, 5],
    ["bandage", 1, 1]
]

# Beute in Müllcontainern
set inventory:dumpsterloot [
    ["aluminum", 1, 5],
    ["metalscrap", 1, 5],
    ["iron", 1, 5],
    ["steel", 1, 5],
    ["glass", 1, 5],
    ["rubber", 1, 5],
    ["plastic", 1, 5]
]

# Items, die mit Konten des Frameworks verknüpft sind
set inventory:accounts ["money"]
