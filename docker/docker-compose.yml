# Docker Compose fuer FXServer + MariaDB.
#
# Erststart (aus dem Projektordner; --env-file ist noetig, weil Compose die .env sonst
# neben der Compose-Datei in docker/ sucht), in dieser Reihenfolge:
#   1. cp .env.example .env                                   # Werte eintragen
#   2. scripts/linux/install-resources.sh                     # Ressourcen auf dem Host installieren
#   3. sudo chown -R 1000:1000 server-data                    # Container laeuft als uid 1000
#   4. docker compose --env-file .env -f docker/docker-compose.yml up -d --wait db
#   5. bash scripts/linux/setup-database.sh --docker          # SQL-Dateien aus database.txt importieren
#   6. docker compose --env-file .env -f docker/docker-compose.yml up -d --build
#
# txAdmin-PIN: docker compose --env-file .env -f docker/docker-compose.yml logs -f fxserver
# txAdmin ist nur auf 127.0.0.1:40120 des Hosts erreichbar (SSH-Tunnel nutzen).

services:
  fxserver:
    # FXServer gibt es fuer Linux nur als x86_64. Auf arm64-Hosts (Apple Silicon, ARM-VPS)
    # laeuft das Image per Emulation, ohne Pin gaebe es "exec format error".
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        FX_CHANNEL: ${FX_CHANNEL:-recommended}
    image: fivem-fxserver:local
    container_name: fxserver
    restart: unless-stopped
    # Nur die vier Werte, die entrypoint.sh fuer secrets.cfg braucht, nicht die komplette
    # .env: das MariaDB-Root-Passwort hat im Spiel-Container nichts verloren.
    environment:
      FIVEM_LICENSE_KEY: ${FIVEM_LICENSE_KEY:-}
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      STEAM_WEBAPI_KEY: ${STEAM_WEBAPI_KEY:-}
      MYSQL_CONNECTION_STRING: ${MYSQL_CONNECTION_STRING:-}
    ports:
      - "30120:30120/tcp"
      - "30120:30120/udp"
      - "127.0.0.1:40120:40120/tcp"
    volumes:
      # Bind-Mount: muss auf dem Host uid 1000 gehoeren (chown -R 1000:1000 server-data)
      - ../server-data:/server-data
      # Benanntes Volume fuer das txAdmin-Profil (Admins, Einstellungen, Logs)
      - txdata:/txData
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s

  db:
    # Qbox braucht MariaDB >= 10.9, empfohlen 12.3 LTS.
    image: mariadb:12.3
    container_name: fxserver-db
    restart: unless-stopped
    # Nur die vier DB-Variablen aus der .env, nicht die komplette Datei: Lizenz-Key,
    # RCON- und Steam-Key haben im Datenbank-Container nichts verloren.
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt in .env}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-fivem}
      MARIADB_USER: ${MYSQL_USER:-fivem}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt in .env}
      # Vorhandenes Datenvolume (z. B. von mariadb:11) beim Start automatisch aktualisieren.
      # Vorher sichern, der erste Start nach dem Upgrade dauert laenger.
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - dbdata:/var/lib/mysql
    # start_period 120s: ein Auto-Upgrade oder ein langsamer Erststart laeuft ohne Netzwerk,
    # Fehlschlaege zaehlen erst danach. Ein erfolgreicher Check vorher meldet sofort healthy.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 3
    # Standardmaessig nicht nach aussen freigegeben. Fuer HeidiSQL & Co. per SSH-Tunnel
    # oder folgende Zeilen einkommentieren (nur lokal binden!):
    # ports:
    #   - "127.0.0.1:3306:3306"

volumes:
  txdata:
  dbdata:
